[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "c2c-dtb"
version = "0.1.0"
description = "Compute-to-Cooling Digital Test Bench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "pint>=0.23",
  "PyYAML>=6.0",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "hypothesis>=6.98", "ruff>=0.6"]
api = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
c2c-dtb = "c2c.simulation.runner:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"configs/scenarios" = ["configs/scenarios/workload_step.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
