="180" y="1335">真实定压 / 补液 / 膨胀 / 标高 / 泄压：OPEN · 表压不可确定</text><text x="180" y="1362" class="tiny">本图只表示二次介质回路。一次介质只与HX热耦合、不直接混合；源侧与负荷侧由客户储罐解耦，但本阶段未动态建模。</text><text x="180" y="1387" class="tiny">研究拆分不是OEM曲线；准稳态模型无水锤/闭锁压力/热响应。不是施工P&amp;ID，不得用于采购或施工。</text></svg>