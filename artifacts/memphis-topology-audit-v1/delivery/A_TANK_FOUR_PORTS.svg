 735" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="760" y="690" font-size="17">冷源返回底部 373.173m&#179;/h</text><text x="760" y="715" font-size="19">39.775°C</text><path d="M460 765L35 765" stroke="#334155" stroke-width="2" fill="none" marker-end="url(#a)"/><text x="35" y="710" font-size="17">底部去转移泵 413.756m&#179;/h</text><text x="35" y="735" font-size="19">40.408°C</text><path d="M600 270V620" stroke="#334155" stroke-width="3" marker-end="url(#a)"/><text x="755" y="410" font-size="19">层间净向下 40.583m³/h</text><text x="755" y="445" font-size="17">各闭合回路进出质量相等，非漏水。</text><text x="35" y="420" font-size="19">上部主体约46°C</text><text x="35" y="455" font-size="17">底层仍可输出约40.4°C</text><text x="35" y="490" font-size="17">但大体积冷层没有恢复</text><text x="24" y="840" font-size="19">合格冷层 1 / 80；一格 0.1875m³。这个体积随网格变化，不是真实罐可用冷量保证。</text><text x="24" y="880" font-size="18">A罐1800s净蓄热 301.507MJ；独立RC只接B罐，不能替A罐恢复。</text><text x="24" y="920" font-size="17">接口角色依据00-P455/P724，但转移HX/第三回路是新增候选；绝对压力、真实布水器与OEM性能未验证。</text></g></svg>