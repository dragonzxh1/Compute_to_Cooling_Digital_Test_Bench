name: M1 remote long-prefix development probe
on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        required: true
        type: string
      execution_manifest_sha256:
        required: true
        type: string
      runner_script_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: m1-remote-long-prefix-development
  cancel-in-progress: false
jobs:
  long-probe:
    runs-on: windows-2022
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      EXECUTION_MANIFEST_SHA256: ${{ inputs.execution_manifest_sha256 }}
      RUNNER_SCRIPT_SHA256: ${{ inputs.runner_script_sha256 }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify bootstrap and dispatch identity
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_SHA -cne $env:EXPECTED_SOURCE_COMMIT -or $env:EXPECTED_SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:EXECUTION_MANIFEST_SHA256 -notmatch '^[a-f0-9]{64}$' -or $env:RUNNER_SCRIPT_SHA256 -notmatch '^[a-f0-9]{64}$'){throw 'M1_DISPATCH_IDENTITY_DENIED'}
          if((Get-FileHash -LiteralPath 'v0_2/tests/tools/m1_remote_control_v2/run.ps1' -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:RUNNER_SCRIPT_SHA256){throw 'M1_BOOTSTRAP_SOURCE_DRIFT'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install unchanged exact dependency lock remotely
        run: |
          python -m pip install --disable-pip-version-check -r v0_2/tests/tools/c3b_v14_1/requirements-development.lock
          if($LASTEXITCODE -ne 0){throw 'M1_DEPENDENCY_INSTALL_FAILED'}
      - name: Fresh long traces, original repeats and terminal prefixes only
        id: base
        run: |
          & ./v0_2/tests/tools/m1_remote_control_v2/run.ps1 -Python (Get-Command python).Source -ExpectedCommit $env:EXPECTED_SOURCE_COMMIT -ExpectedManifestSha256 $env:EXECUTION_MANIFEST_SHA256 -Mode BASE
      - name: Preserve raw evidence, fresh selection and STOP records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1-long-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 7
