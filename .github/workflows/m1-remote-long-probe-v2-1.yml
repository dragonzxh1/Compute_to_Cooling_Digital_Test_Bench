name: C3-C delivery v4 DEVELOPMENT read-only evidence transport
on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        required: true
        type: string
      execution_manifest_sha256:
        required: true
        type: string
      runner_script_sha256:
        required: true
        type: string
permissions:
  contents: read
  actions: read
concurrency:
  group: c3c-delivery-v4-readonly
  cancel-in-progress: false
jobs:
  original-evidence-transport-proof:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      EXECUTION_MANIFEST_SHA256: ${{ inputs.execution_manifest_sha256 }}
      RUNNER_SCRIPT_SHA256: ${{ inputs.runner_script_sha256 }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact DEVELOPMENT read-only dispatch
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_SHA -cne $env:EXPECTED_SOURCE_COMMIT -or $env:EXPECTED_SOURCE_COMMIT -cnotmatch '^[a-f0-9]{40}$'){throw 'DELIVERY_DISPATCH_COMMIT_DRIFT'}
          if((git rev-parse HEAD) -cne $env:EXPECTED_SOURCE_COMMIT){throw 'DELIVERY_CHECKOUT_DRIFT'}
          if((Get-FileHash v0_2/tests/tools/m1_c3c_delivery_v4/readonly_control.json).Hash.ToLowerInvariant() -cne $env:EXECUTION_MANIFEST_SHA256){throw 'DELIVERY_CONTROL_DRIFT'}
          if((Get-FileHash v0_2/tests/tools/m1_c3c_delivery_v4/run_readonly.ps1).Hash.ToLowerInvariant() -cne $env:RUNNER_SCRIPT_SHA256){throw 'DELIVERY_RUNNER_DRIFT'}
      - name: Read official historical evidence only; never execute a candidate
        run: |
          try {
            & ./v0_2/tests/tools/m1_c3c_delivery_v4/run_readonly.ps1 -ExpectedCommit $env:EXPECTED_SOURCE_COMMIT -ExpectedControlSha256 $env:EXECUTION_MANIFEST_SHA256
          } catch {
            $taskFailureRoot='artifacts/m1-c3c-delivery-v4/preflight-'+$env:GITHUB_RUN_ID+'-'+$env:GITHUB_RUN_ATTEMPT
            New-Item -ItemType Directory -Path $taskFailureRoot -Force | Out-Null
            [IO.File]::WriteAllText((Join-Path $taskFailureRoot 'failure.json'),(@{status='INVALID_READONLY_DELIVERY_PROOF';error=$_.Exception.Message;source=$env:GITHUB_SHA;candidate_executed=$false;formal_qualification_executed=$false}|ConvertTo-Json),[Text.UTF8Encoding]::new($false))
            throw
          }
      - name: Preserve read-only transport evidence and failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: C3-C-DELIVERY-V4-READONLY-PROOF
          path: artifacts/m1-c3c-delivery-v4/
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
          compression-level: 6
