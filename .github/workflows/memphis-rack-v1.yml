name: Memphis single rack then six CDU DEVELOPMENT
on:
  push:
    branches: [codex/memphis-single-rack-v1]
    paths:
      - 'v0_2/tests/tools/memphis_single_rack_v1/**'
      - '.github/workflows/memphis-rack-v1*.yml'
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: memphis-single-then-six-development
  cancel-in-progress: false
jobs:
  baseline:
    uses: ./.github/workflows/memphis-rack-v1-runner.yml
    with:
      group: baseline
      expected_commit: ${{ github.sha }}
      manifest_sha256: ${{ inputs.manifest_sha256 || '' }}
      dispatch_expected_commit: ${{ inputs.expected_commit || '' }}
  component:
    needs: baseline
    uses: ./.github/workflows/memphis-rack-v1-runner.yml
    with:
      group: component
      expected_commit: ${{ github.sha }}
      manifest_sha256: ${{ inputs.manifest_sha256 || '' }}
      dispatch_expected_commit: ${{ inputs.expected_commit || '' }}
  single:
    needs: component
    uses: ./.github/workflows/memphis-rack-v1-runner.yml
    with:
      group: single
      expected_commit: ${{ github.sha }}
      manifest_sha256: ${{ inputs.manifest_sha256 || '' }}
      dispatch_expected_commit: ${{ inputs.expected_commit || '' }}
  six:
    needs: single
    uses: ./.github/workflows/memphis-rack-v1-runner.yml
    with:
      group: six
      expected_commit: ${{ github.sha }}
      manifest_sha256: ${{ inputs.manifest_sha256 || '' }}
      dispatch_expected_commit: ${{ inputs.expected_commit || '' }}
  report:
    needs: [baseline, component, single, six]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: memphis-rack-compact-*
          path: artifacts/memphis-rack-v1-analysis/
          merge-multiple: true
      - name: Consolidated independent numerical and causal evidence
        shell: pwsh
        run: |
          & ./v0_2/tests/tools/memphis_single_rack_v1/report.ps1 -Root ./artifacts/memphis-rack-v1-analysis -ExpectedCommit $env:GITHUB_SHA
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memphis-rack-report-${{ github.run_id }}
          path: artifacts/memphis-rack-v1-analysis/
          retention-days: 30
          if-no-files-found: error
