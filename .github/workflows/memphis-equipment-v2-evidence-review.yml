name: Memphis V2 independent PURE FILE review
on:
  push:
    branches: [codex/memphis-equipment-v2-evidence-review]
    paths: ['artifacts/memphis-equipment-v2-review/**', '.github/workflows/memphis-equipment-v2-evidence-review.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: memphis-v2-independent-file-review
  cancel-in-progress: false
env:
  GH_TOKEN: ${{ github.token }}
  PYTHONDONTWRITEBYTECODE: '1'
jobs:
  prepare:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - shell: pwsh
        run: ./artifacts/memphis-equipment-v2-review/prepare_file_review.ps1 -Mode PREP
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-prepared
          path: |
            review/*.json
            review/report-complete/
          if-no-files-found: error
  review:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        group: [baseline, units-a, units-b, units-c, group-a, group-b, recharge]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: review-prepared
          path: review
      - shell: pwsh
        run: ./artifacts/memphis-equipment-v2-review/prepare_file_review.ps1 -Mode GROUP -Group '${{ matrix.group }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: independent-${{ matrix.group }}
          path: review/runtime/
          if-no-files-found: error
  delivery:
    needs: [prepare, review]
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: review-prepared
          path: review
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: independent-*
          path: review/group-results
      - shell: pwsh
        run: ./artifacts/memphis-equipment-v2-review/prepare_file_review.ps1 -Mode FINAL
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memphis-v2-final-independent-delivery-${{ github.run_id }}
          path: |
            review/delivery/
            review/runtime/
            review/group-results/
            review/source_closure.json
          if-no-files-found: error
