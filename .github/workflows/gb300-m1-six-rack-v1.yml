name: GB300 M1 six-rack integration DEVELOPMENT v1
on:
  workflow_dispatch:
    inputs:
      expected_commit:
        required: true
        type: string
      manifest_sha256:
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: gb300-m1-six-rack-integration-v1
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  integration:
    runs-on: windows-2022
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Hash-bound source hydration only
        shell: pwsh
        run: |
          if($env:GITHUB_SHA -cne '${{ inputs.expected_commit }}'){throw 'COMMIT_DRIFT'}
          $m=Get-Content 'v0_2/tests/tools/m1_remote_control_v3/execution_manifest.json' -Raw|ConvertFrom-Json
          foreach($b in $m.bundle_entry_raw_hashes.PSObject.Properties){
            if((Test-Path -LiteralPath $b.Name) -and (Get-FileHash -LiteralPath $b.Name -Algorithm SHA256).Hash.ToLowerInvariant() -cne $b.Value){throw ('EXISTING_FROZEN_SOURCE_DRIFT '+$b.Name)}
          }
          . ./v0_2/tests/tools/m1_remote_control_v3/restore_snapshot.ps1
          $null=Restore-M1Snapshot -Repo (Get-Location).Path -ExpectedManifestSha256 '6842d3bd57a73d883d724fe7352680f9dfd1ba9a2c420b9ec5fa0925b05ffe93'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install exact development dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r v0_2/tests/tools/c3b_v14_1/requirements-development.lock
          if($LASTEXITCODE -ne 0){throw 'DEPENDENCY_INSTALL_FAILED'}
      - name: Bounded negatives and two fresh closed-loop scenarios
        shell: pwsh
        run: |
          & ./v0_2/tests/tools/gb300_m1_closed_loop_v1/run_remote.ps1 -ExpectedCommit '${{ inputs.expected_commit }}' -ExpectedManifestSha256 '${{ inputs.manifest_sha256 }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: six-rack-integration-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/m1-autonomous-development/six-rack-*/
            artifacts/m1-remote-executor-v1/build/build_identity.json
            v0_2/tests/tools/gb300_m1_closed_loop_v1/source_manifest.json
          retention-days: 30
          if-no-files-found: error
