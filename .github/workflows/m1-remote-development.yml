name: M1 post publication development
on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        type: string
        required: true
      execution_manifest_sha256:
        type: string
        required: true
      runner_script_sha256:
        type: string
        required: true
      target:
        type: choice
        options: [v3, v4]
        default: v3
permissions:
  contents: read
concurrency:
  group: m1-post-atomicity-development
  cancel-in-progress: false
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
  EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
  EXPECTED_MANIFEST: ${{ inputs.execution_manifest_sha256 }}
  EXPECTED_RUNNER: ${{ inputs.runner_script_sha256 }}
  ATOMICITY_TARGET: ${{ inputs.target }}
jobs:
  controlled-witness:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify execution/bootstrap identity
        shell: pwsh
        run: |
          if($env:EXPECTED_SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:GITHUB_SHA -cne $env:EXPECTED_SOURCE_COMMIT -or (git rev-parse HEAD) -cne $env:EXPECTED_SOURCE_COMMIT){throw 'DISPATCH_SOURCE_DENIED'}
          if($env:EXPECTED_MANIFEST -notmatch '^[a-f0-9]{64}$' -or (Get-FileHash v0_2/tests/tools/m1_engine_v4/development_manifest.json -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_MANIFEST){throw 'DISPATCH_MANIFEST_DENIED'}
          if($env:EXPECTED_RUNNER -notmatch '^[a-f0-9]{64}$' -or (Get-FileHash v0_2/tests/tools/m1_engine_v4/run_remote.ps1 -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:EXPECTED_RUNNER){throw 'DISPATCH_RUNNER_DENIED'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Restore protected source and locked dependencies
        shell: pwsh
        run: |
          . ./v0_2/tests/tools/m1_remote_control_v3/restore_snapshot.ps1
          $null=Restore-M1Snapshot -Repo (Get-Location).Path -ExpectedManifestSha256 '6842d3bd57a73d883d724fe7352680f9dfd1ba9a2c420b9ec5fa0925b05ffe93'
          python -m pip install --disable-pip-version-check -r v0_2/tests/tools/c3b_v14_1/requirements-development.lock
          if($LASTEXITCODE -ne 0){throw 'LOCKED_DEPENDENCY_INSTALL_FAILED'}
      - name: Actual Python Job bounded development witness
        shell: pwsh
        run: |
          & ./v0_2/tests/tools/m1_engine_v4/run_remote.ps1 -Python (Get-Command python).Source -ExpectedCommit $env:EXPECTED_SOURCE_COMMIT -ExpectedManifestSha256 $env:EXPECTED_MANIFEST -Target $env:ATOMICITY_TARGET
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: post-atomicity-${{ inputs.target }}
          path: |
            artifacts/m1-post-atomicity/
            artifacts/m1-remote-executor-v1/build/build_identity.json
          retention-days: 30
          if-no-files-found: error
