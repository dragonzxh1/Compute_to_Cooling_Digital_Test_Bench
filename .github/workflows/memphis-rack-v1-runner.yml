name: Memphis rack-first V1 controlled group
on:
  workflow_call:
    inputs:
      group:
        required: true
        type: string
      expected_commit:
        required: true
        type: string
      manifest_sha256:
        required: false
        type: string
        default: ''
      dispatch_expected_commit:
        required: false
        type: string
        default: ''
permissions:
  contents: read
env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
  OMP_NUM_THREADS: '1'
  OPENBLAS_NUM_THREADS: '1'
  MKL_NUM_THREADS: '1'
jobs:
  integration:
    runs-on: windows-2022
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Hash-bound source hydration only
        shell: pwsh
        run: |
          $expected='${{ inputs.expected_commit }}'
          if($env:GITHUB_SHA -cne $expected){throw 'COMMIT_DRIFT'}
          $dispatch='${{ inputs.dispatch_expected_commit }}'
          if($dispatch -and $dispatch -cne $env:GITHUB_SHA){throw 'DISPATCH_COMMIT_DRIFT'}
          if((git rev-parse HEAD) -cne $env:GITHUB_SHA){throw 'CHECKOUT_DRIFT'}
          $m=Get-Content 'v0_2/tests/tools/m1_remote_control_v3/execution_manifest.json' -Raw|ConvertFrom-Json
          # This ONE tracked transport file is LF in Git and CRLF in the
          # historical sealed bundle. Both byte identities are registered;
          # execution always requires the original sealed CRLF hash after hydration.
          $transportPath='v0_2/tests/tools/m1_remote_control_v1/source_inventory.json'
          $transportHash='dd016d1bafd016c6f014520d277ce9ab79024e7a3b224bca5c5d8c7426a2a3f9'
          foreach($b in $m.bundle_entry_raw_hashes.PSObject.Properties){
            if(Test-Path -LiteralPath $b.Name){
              $actual=(Get-FileHash -LiteralPath $b.Name -Algorithm SHA256).Hash.ToLowerInvariant()
              $transport=($b.Name -ceq $transportPath -and $actual -ceq $transportHash -and $b.Value -ceq '02d336b2c5217ef279ced4f9ebefafc7ec2b9110ec567da7341052f0b073fa39')
              if($actual -cne $b.Value -and -not $transport){throw ('EXISTING_FROZEN_SOURCE_DRIFT '+$b.Name)}
            }
          }
          . ./v0_2/tests/tools/m1_remote_control_v3/restore_snapshot.ps1
          $null=Restore-M1Snapshot -Repo (Get-Location).Path -ExpectedManifestSha256 '6842d3bd57a73d883d724fe7352680f9dfd1ba9a2c420b9ec5fa0925b05ffe93'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install exact development dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r v0_2/tests/tools/c3b_v14_1/requirements-development.lock
          if($LASTEXITCODE -ne 0){throw 'DEPENDENCY_INSTALL_FAILED'}
      - name: Bounded Memphis rack-first V1 group
        shell: pwsh
        run: |
          $manifest=(Get-FileHash 'v0_2/tests/tools/memphis_single_rack_v1/source_manifest.json' -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected='${{ inputs.manifest_sha256 }}'
          if($expected -and $manifest -cne $expected){throw 'DISPATCH_MANIFEST_DRIFT'}
          & ./v0_2/tests/tools/memphis_single_rack_v1/run_remote.ps1 -ExpectedCommit $env:GITHUB_SHA -ExpectedManifestSha256 $manifest -StudyGroup '${{ inputs.group }}'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memphis-rack-raw-${{ inputs.group }}-${{ github.run_id }}
          path: |
            artifacts/m1-autonomous-development/memphis-rack-v1-*/${{ inputs.group }}/
            artifacts/m1-remote-executor-v1/build/build_identity.json
            v0_2/tests/tools/memphis_single_rack_v1/source_manifest.json
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: memphis-rack-compact-${{ inputs.group }}-${{ github.run_id }}
          path: artifacts/memphis-rack-v1-compact/
          retention-days: 30
          if-no-files-found: warn
