name: Liquid cooling recovery smoke

on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        description: Exact development branch commit; never runs a full campaign
        required: true
        type: string
      execution_manifest_sha256:
        description: Approved remote execution manifest RAW SHA-256
        required: true
        type: string
      runner_script_sha256:
        description: Remote runner RAW SHA-256 checked before invocation
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: liquid-cooling-recovery-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      EXPECTED_SOURCE_COMMIT: ${{ inputs.expected_source_commit }}
      EXECUTION_MANIFEST_SHA256: ${{ inputs.execution_manifest_sha256 }}
      RUNNER_SCRIPT_SHA256: ${{ inputs.runner_script_sha256 }}
      PYTHONDONTWRITEBYTECODE: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify dispatch and script identity before running repository code
        run: |
          $ErrorActionPreference='Stop'
          if($env:GITHUB_SHA -cne $env:EXPECTED_SOURCE_COMMIT -or
             $env:EXPECTED_SOURCE_COMMIT -notmatch '^[a-f0-9]{40}$' -or
             $env:EXECUTION_MANIFEST_SHA256 -notmatch '^[a-f0-9]{64}$' -or
             $env:RUNNER_SCRIPT_SHA256 -notmatch '^[a-f0-9]{64}$') {throw 'DISPATCH_IDENTITY_REJECTED'}
          $p='v0_2/tests/tools/liquid_recovery_remote_v1/run.ps1'
          if((Get-FileHash -LiteralPath $p -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:RUNNER_SCRIPT_SHA256) {throw 'RUNNER_SCRIPT_DRIFT'}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Install exact declared dependencies in the disposable remote environment
        run: |
          python -m pip install --disable-pip-version-check -r v0_2/tests/tools/c3b_v14_1/requirements-development.lock
          if($LASTEXITCODE -ne 0) {throw 'REMOTE_DEPENDENCY_INSTALL_FAILED'}
      - name: Run only environment preflight and generic liquid-cooling smoke
        run: |
          $python=(Get-Command python).Source
          & ./v0_2/tests/tools/liquid_recovery_remote_v1/run.ps1 -Python $python -ExpectedCommit $env:EXPECTED_SOURCE_COMMIT -ExpectedManifestSha256 $env:EXECUTION_MANIFEST_SHA256
      - name: Preserve local authoritative evidence even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: liquid-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/liquid-recovery-v1/
          if-no-files-found: warn
          retention-days: 7
