name: C3-C authority preflight development dispatcher
on:
  workflow_dispatch:
    inputs:
      expected_source_commit:
        type: string
        required: true
      execution_manifest_sha256:
        type: string
        required: true
      runner_script_sha256:
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: c3c-authority-development-dispatch
  cancel-in-progress: false
jobs:
  preflight:
    uses: ./.github/workflows/m1-c3c-preflight.yml
    with:
      expected_source_commit: ${{ inputs.expected_source_commit }}
      preflight_control_sha256: ${{ inputs.execution_manifest_sha256 }}
      preflight_runner_sha256: ${{ inputs.runner_script_sha256 }}
