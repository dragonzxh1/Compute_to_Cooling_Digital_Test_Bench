          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ./.github/actions/m1-c3c-runtime-v3
        with:
          commit: ${{ inputs.expected_source_commit }}
          manifest: ${{ inputs.execution_manifest_sha256 }}
          runner: ${{ inputs.runner_script_sha256 }}
          approval_b64: ${{ inputs.approval_receipt_b64 }}
          approval_sha256: ${{ inputs.approval_receipt_sha256 }}
          authorization_b64: ${{ inputs.execution_authorization_b64 }}
          authorization_sha256: ${{ inputs.execution_authorization_sha256 }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepare
          path: artifacts/
      - name: Controlled REFERENCE
        shell: pwsh
        run: |
          & ./v0_2/tests/tools/m1_c3c_v3/run.ps1 -Python (Get-Command python).Source -ExpectedCommit "${{ inputs.expected_source_commit }}" -ExpectedManifestSha256 "${{ inputs.execution_manifest_sha256 }}" -Mode REFERENCE -JobKey "ref-${{ matrix.group }}" -IndicesCsv "${{ matrix.indices }}" -MemoryProfile CAMPAIGN
      - name: Export owned evidence
        if: always()
