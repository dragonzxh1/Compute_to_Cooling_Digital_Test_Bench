        run: |
          & ./v0_2/tests/tools/m1_remote_control_v3/export.ps1 -JobKey "ref-${{ matrix.group }}" -IndicesCsv "${{ matrix.indices }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: ref-${{ matrix.group }}
          path: artifacts/export/ref-${{ matrix.group }}/
