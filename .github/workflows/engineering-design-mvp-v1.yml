name: C2C engineering design bounded research
on:
  push:
    branches: ['codex/engineering-design-mvp-*']
    paths: ['v0_2/tests/tools/engineering_design_mvp_v1/**', '.github/workflows/engineering-design-mvp-v1.yml']
permissions:
  contents: read
concurrency:
  group: engineering-design-${{ github.ref }}
  cancel-in-progress: false
jobs:
  research:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - name: Preserve source bytes
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11.9'
          architecture: x64
      - name: Pinned dependency only
        shell: pwsh
        run: python -m pip install numpy==2.4.6
      - name: One input-bound short research task
        shell: pwsh
        run: ./v0_2/tests/tools/engineering_design_mvp_v1/run_remote.ps1 -ExpectedCommit $env:GITHUB_SHA -Stage baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: engineering-design-${{ github.run_id }}
          path: |
            artifacts/engineering-design-mvp-v1/
            v0_2/tests/tools/engineering_design_mvp_v1/
          retention-days: 30
          if-no-files-found: error
