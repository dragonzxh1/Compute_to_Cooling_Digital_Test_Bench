name: Exact user-approved C3-C runtime bootstrap
description: No candidate execution without byte-bound scope and execution approval
inputs:
  commit:
    required: true
  manifest:
    required: true
  runner:
    required: true
  approval_b64:
    required: true
  approval_sha256:
    required: true
  authorization_b64:
    required: true
  authorization_sha256:
    required: true
runs:
  using: composite
  steps:
    - name: Exact C3-C source and approval bootstrap
      shell: pwsh
      env:
        C3C_COMMIT: ${{ inputs.commit }}
        C2C_C3C_PACKAGE_SHA256: ${{ inputs.manifest }}
        C3C_RUNNER: ${{ inputs.runner }}
        C2C_C3C_APPROVAL_B64: ${{ inputs.approval_b64 }}
        C2C_C3C_APPROVAL_SHA256: ${{ inputs.approval_sha256 }}
        C2C_C3C_AUTHORIZATION_B64: ${{ inputs.authorization_b64 }}
        C2C_C3C_AUTHORIZATION_SHA256: ${{ inputs.authorization_sha256 }}
      run: |
        $ErrorActionPreference='Stop'
        if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or [Environment]::MachineName -ieq 'HIPPO'){throw 'C3C_REMOTE_ONLY'}
        if($env:C3C_COMMIT -cnotmatch '^[a-f0-9]{40}$' -or $env:GITHUB_SHA -cne $env:C3C_COMMIT -or (git rev-parse HEAD) -cne $env:C3C_COMMIT){throw 'C3C_SOURCE_COMMIT_DRIFT'}
        $package='artifacts/m1-c3c-v5-freeze/executable_proposal.json'
        if($env:C2C_C3C_PACKAGE_SHA256 -cnotmatch '^[a-f0-9]{64}$' -or (Get-FileHash -LiteralPath $package).Hash.ToLowerInvariant() -cne $env:C2C_C3C_PACKAGE_SHA256){throw 'C3C_EXACT_PACKAGE_REQUIRED'}
        if($env:C3C_RUNNER -cnotmatch '^[a-f0-9]{64}$' -or (Get-FileHash v0_2/tests/tools/m1_c3c_v5/run.ps1).Hash.ToLowerInvariant() -cne $env:C3C_RUNNER){throw 'C3C_RUNNER_DRIFT'}
        . ./v0_2/tests/tools/m1_c3c_v5/batch.ps1
        $null=Get-C3DispatchIdentity
        . ./v0_2/tests/tools/m1_remote_control_v3/restore_snapshot.ps1
        $null=Restore-M1Snapshot -Repo (Get-Location).Path -ExpectedManifestSha256 '6842d3bd57a73d883d724fe7352680f9dfd1ba9a2c420b9ec5fa0925b05ffe93'
        $m=Get-Content -LiteralPath $package -Raw|ConvertFrom-Json
        if($m.status -cne 'FINALIZED_AWAITING_USER_APPROVAL' -or $m.scope -cne 'M1_C3_C_LIMITED_SOFTWARE_FIXTURE_DOMAIN'){throw 'C3C_PACKAGE_NOT_FINALIZED'}
        foreach($b in $m.source_raw_sha256.PSObject.Properties){
          if($b.Name -match '(^[/\\]|:|(^|[/\\])\.\.([/\\]|$))'){throw 'C3C_SOURCE_PATH_ESCAPE'}
          if((Get-FileHash -LiteralPath $b.Name).Hash.ToLowerInvariant() -cne $b.Value){throw 'C3C_SOURCE_CLOSURE_DRIFT'}
        }
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11.9'
        architecture: x64
    - name: Exact dependency lock only
      shell: pwsh
      run: |
        python -m pip install --disable-pip-version-check -r v0_2/tests/tools/c3b_v14_1/requirements-development.lock
        if($LASTEXITCODE -ne 0){throw 'C3C_DEPENDENCY_INSTALL_FAILED'}
