name: M1 V4 source-bound hosted runtime
description: New development identity, unchanged frozen dependency bytes
inputs:
  commit:
    required: true
  manifest:
    required: true
  runner:
    required: true
runs:
  using: composite
  steps:
    - name: Verify V4 execution/bootstrap and hydrate frozen dependencies
      shell: pwsh
      env:
        V4_COMMIT: ${{ inputs.commit }}
        V4_MANIFEST: ${{ inputs.manifest }}
        V4_RUNNER: ${{ inputs.runner }}
      run: |
        if($env:GITHUB_ACTIONS -cne 'true' -or $env:RUNNER_ENVIRONMENT -cne 'github-hosted' -or $env:RUNNER_OS -cne 'Windows' -or [Environment]::MachineName -ieq 'HIPPO'){throw 'REMOTE_ONLY'}
        if($env:V4_COMMIT -notmatch '^[a-f0-9]{40}$' -or $env:GITHUB_SHA -cne $env:V4_COMMIT -or (git rev-parse HEAD) -cne $env:V4_COMMIT){throw 'V4_EXECUTION_SOURCE_DRIFT'}
        if($env:V4_MANIFEST -notmatch '^[a-f0-9]{64}$' -or (Get-FileHash v0_2/tests/tools/m1_campaign_v4/execution_manifest.json -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:V4_MANIFEST){throw 'V4_MANIFEST_DRIFT'}
        if($env:V4_RUNNER -notmatch '^[a-f0-9]{64}$' -or (Get-FileHash v0_2/tests/tools/m1_campaign_v4/run.ps1 -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:V4_RUNNER){throw 'V4_RUNNER_DRIFT'}
        $m=Get-Content v0_2/tests/tools/m1_campaign_v4/execution_manifest.json -Raw|ConvertFrom-Json
        foreach($b in $m.remote_source_raw_hashes.PSObject.Properties){if((Get-FileHash -LiteralPath $b.Name -Algorithm SHA256).Hash.ToLowerInvariant() -cne $b.Value){throw 'V4_SOURCE_CLOSURE_DRIFT'}}
        . ./v0_2/tests/tools/m1_remote_control_v3/restore_snapshot.ps1
        $null=Restore-M1Snapshot -Repo (Get-Location).Path -ExpectedManifestSha256 '6842d3bd57a73d883d724fe7352680f9dfd1ba9a2c420b9ec5fa0925b05ffe93'
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: '3.11.9'
        architecture: x64
    - name: Exact original development dependency lock
      shell: pwsh
      run: |
        python -m pip install --disable-pip-version-check -r v0_2/tests/tools/c3b_v14_1/requirements-development.lock
        if($LASTEXITCODE -ne 0){throw 'DEPENDENCY_LOCK_FAILURE'}
